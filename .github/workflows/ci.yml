name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - stage18-sandbox-payment-reliability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,agent,day10]"
      - name: Run test suite
        run: python -m pytest -o addopts= -q
      - name: Compile application
        run: python -m compileall -q src/agentsentinel
      - name: Run offline attack suite
        run: python scripts/run_attack_suite.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependency audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Scan worktree and reachable history for secrets
        run: python scripts/scan_secrets.py
      - name: Audit pinned container dependencies
        run: python -m pip_audit --no-deps --disable-pip -r requirements-container.lock
